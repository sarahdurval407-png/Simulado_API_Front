<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de evento</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <div class="pagina">

        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <h1>Gerenciador de eventos</h1>

            <nav>
                <a href="login.html">Cadastro de palestrantes</a>
                <a href="cadastro.html">Cadastro de evento</a>
                <a href="gerenciador.html">Gerenciador de evento</a>
            </nav>

        </header>


        <!-- CONTEÚDO -->
        <main class="conteudo">

            <h2>Cadastro palestrante</h2>

            <form id="formEvento">

                <!-- NOME -->
                <div class="campo">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >

                </div>


                <!-- DESCRIÇÃO -->
                <div class="campo">

                    <label for="descricao">
                        Descrição
                    </label>

                    <input
                        type="text"
                        id="descricao"
                        name="descricao"
                        required
                    >

                </div>


                <!-- LOCAL -->
                <div class="campo">

                    <label for="local">
                        Local
                    </label>

                    <input
                        type="text"
                        id="local"
                        name="local"
                        required
                    >

                </div>


                <!-- PALESTRANTE -->
                <div class="campo">

                    <label for="palestrante">
                        Palestrante
                    </label>

                    <select
                        id="palestrante"
                        name="palestrante"
                        required
                    >

                        <option value="1">
                            Isabel
                        </option>

                        <option value="2">
                            João
                        </option>

                        <option value="3">
                            Maria
                        </option>

                    </select>

                </div>


                <!-- BOTÃO -->
                <button type="submit">
                    Cadastrar
                </button>


                <!-- MENSAGEM -->
                <p id="mensagem"></p>

            </form>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
